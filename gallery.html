<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギャラリー | ピンの音</title>
<meta name="description" content="ボウリング学習ノート「ピンの音」のギャラリー。フォームやスコアシート、レーンの記録写真をまとめています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14213D;
    --navy-deep:#0D1730;
    --lane:#3667E0;
    --lane-light:#6E93F2;
    --pin:#FF4FA0;
    --pin-soft:#FFD1E8;
    --cream:#FFF6EA;
    --gold:#F2A93B;
    --ink:#14213D;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'M PLUS Rounded 1c', sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.8;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}
  .mono{font-family:'JetBrains Mono', monospace;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:100;
    background:rgba(20,33,61,0.92);
    backdrop-filter:blur(6px);
    border-bottom:3px solid var(--pin);
  }
  .nav-wrap{
    max-width:1120px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px;
  }
  .logo{
    color:var(--cream);
    font-weight:800;
    font-size:1.3rem;
    letter-spacing:.04em;
    display:flex; align-items:center; gap:10px;
  }
  .logo-pin{
    width:20px;height:26px;
    background:var(--cream);
    border-radius:60% 60% 50% 50%/70% 70% 40% 40%;
    position:relative;
    flex-shrink:0;
  }
  .logo-pin::after{
    content:"";
    position:absolute; top:38%; left:50%;
    width:60%; height:3px;
    background:var(--pin);
    transform:translateX(-50%);
  }
  nav ul{ display:flex; gap:28px; list-style:none; }
  nav a{
    color:var(--pin-soft);
    font-weight:500;
    font-size:.92rem;
    position:relative;
    padding-bottom:4px;
  }
  nav a.current{ color:var(--cream); }
  nav a::after{
    content:"";
    position:absolute; left:0; bottom:0;
    width:0; height:2px;
    background:linear-gradient(90deg,var(--lane-light),var(--pin));
    transition:width .25s ease;
  }
  nav a:hover::after, nav a.current::after{ width:100%; }

  /* ---------- Page header ---------- */
  .page-hero{
    position:relative;
    background:var(--navy-deep);
    color:var(--cream);
    padding:64px 24px 44px;
    overflow:hidden;
  }
  .carpet-pattern{
    position:absolute; inset:0;
    opacity:.14;
    pointer-events:none;
  }
  .page-hero-inner{
    position:relative; z-index:2;
    max-width:800px; margin:0 auto;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:.78rem;
    letter-spacing:.16em;
    color:var(--gold);
    border:1px solid rgba(242,169,60,.5);
    padding:6px 14px;
    border-radius:100px;
    margin-bottom:18px;
  }
  .eyebrow::before{ content:"●"; color:var(--pin); font-size:.6rem; }
  h1.page-title{
    font-size:clamp(2rem, 5vw, 2.8rem);
    font-weight:800;
    margin-bottom:12px;
  }
  .page-sub{
    color:rgba(255,246,234,.75);
    font-size:.98rem;
    max-width:520px;
  }

  /* ---------- Filter tabs ---------- */
  main{ padding:44px 24px 100px; }
  .gallery-wrap{ max-width:1120px; margin:0 auto; }

  .filters{
    display:flex; gap:10px; flex-wrap:wrap;
    margin-bottom:36px;
  }
  .filter-btn{
    background:transparent;
    border:1.5px solid #d8cdb6;
    color:#5a6584;
    padding:9px 18px;
    border-radius:100px;
    font-size:.85rem;
    font-weight:500;
    cursor:pointer;
    transition:all .18s ease;
  }
  .filter-btn:hover{ border-color:var(--lane); color:var(--lane); }
  .filter-btn.active{
    background:var(--navy);
    border-color:var(--navy);
    color:var(--cream);
  }

  /* ---------- Gallery grid ---------- */
  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:22px;
  }
  .g-item{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    border:2px solid transparent;
    transition:border-color .2s ease, transform .2s ease;
  }
  .g-item:hover{ border-color:var(--pin); transform:translateY(-4px); }

  .g-thumb{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    background:
      linear-gradient(135deg, rgba(54,103,224,.14), rgba(255,79,160,.14)),
      repeating-linear-gradient(45deg, #efe6d3 0 10px, #f4ecdd 10px 20px);
    display:flex; align-items:center; justify-content:center;
    color:#b9ad91;
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    text-align:center;
    padding:10px;
  }
  .g-thumb img{
    width:100%; height:100%; object-fit:cover;
    display:block;
  }
  .g-tag{
    position:absolute; top:10px; left:10px;
    background:var(--navy);
    color:var(--pin-soft);
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem;
    letter-spacing:.06em;
    padding:4px 10px;
    border-radius:100px;
  }
  .g-info{ padding:14px 16px 18px; }
  .g-date{
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    color:var(--pin);
    margin-bottom:4px;
    display:block;
  }
  .g-caption{
    font-size:.88rem;
    color:#3f4a63;
  }

  .gallery-empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:#8892a8;
    font-size:.92rem;
    border:1.5px dashed #d8cdb6;
    border-radius:14px;
  }

  @media (max-width: 560px){
    nav ul{ display:none; }
  }

  /* ---------- Footer ---------- */
  footer{
    background:var(--navy-deep);
    color:rgba(255,246,234,.6);
    padding:48px 24px 32px;
  }
  .footer-inner{
    max-width:1120px; margin:0 auto;
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:20px;
  }
  .footer-nav{ display:flex; gap:22px; list-style:none; flex-wrap:wrap; }
  .footer-nav a{ font-size:.85rem; color:rgba(255,246,234,.7); }
  .footer-nav a:hover{ color:var(--pin-soft); }
  .footer-small{ font-family:'JetBrains Mono', monospace; font-size:.72rem; }
</style>
</head>
<body>

<header>
  <div class="nav-wrap">
    <a href="index.html" class="logo"><span class="logo-pin"></span>ピンの音</a>
    <nav>
      <ul>
        <li><a href="index.html">TOP</a></li>
        <li><a href="blog.html">日記</a></li>
        <li><a href="gallery.html" class="current">ギャラリー</a></li>
        <li><a href="about.html">このサイトについて</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="page-hero">
  <svg class="carpet-pattern" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="carpet" width="80" height="80" patternUnits="userSpaceOnUse">
        <path d="M0 40 Q20 0 40 40 T80 40" stroke="#FF4FA0" stroke-width="3" fill="none"/>
        <path d="M0 60 Q20 20 40 60 T80 60" stroke="#6E93F2" stroke-width="3" fill="none"/>
        <circle cx="10" cy="10" r="3" fill="#F2A93B"/>
        <circle cx="60" cy="70" r="3" fill="#FF4FA0"/>
      </pattern>
    </defs>
    <rect width="400" height="400" fill="url(#carpet)"/>
  </svg>
  <div class="page-hero-inner">
    <span class="eyebrow">GALLERY</span>
    <h1 class="page-title">ギャラリー</h1>
    <p class="page-sub">フォームのチェック写真、スコアシートの記録、レーンや施設の風景などを残していきます。</p>
  </div>
</section>

<main>
  <div class="gallery-wrap">

    <div class="filters">
      <button class="filter-btn active" data-filter="all">すべて</button>
      <button class="filter-btn" data-filter="form">フォーム</button>
      <button class="filter-btn" data-filter="score">スコアシート</button>
      <button class="filter-btn" data-filter="lane">レーン・施設</button>
      <button class="filter-btn" data-filter="other">その他</button>
    </div>

    <!--
      写真を追加する場合は g-item ブロックをコピーし、
      data-category を form / score / lane / other から選び、
      g-thumb 内に <img src="images/ファイル名.jpg" alt="説明"> を追加してください。
      （画像を用意するまでは g-thumb がプレースホルダー表示になります）

      <div class="g-item" data-category="form">
        <div class="g-thumb">
          <span>NO IMAGE</span>
        </div>
        <div class="g-info">
          <span class="g-date mono">2026.08.05</span>
          <p class="g-caption">ここにキャプションを書きます。</p>
        </div>
      </div>
    -->

    <div class="gallery-grid" id="galleryGrid">
      <p class="gallery-empty">まだ写真がありません。撮りためたら少しずつ追加していきます。</p>
    </div>

  </div>
</main>

<footer>
  <div class="footer-inner">
    <ul class="footer-nav">
      <li><a href="index.html">TOP</a></li>
      <li><a href="blog.html">日記</a></li>
      <li><a href="gallery.html">ギャラリー</a></li>
      <li><a href="about.html">このサイトについて</a></li>
    </ul>
    <span class="footer-small mono">© ピンの音 — Bowling Study Notes</span>
  </div>
</footer>

<script>
  // カテゴリフィルタ（写真を追加した後に有効化されます）
  const buttons = document.querySelectorAll('.filter-btn');
  const grid = document.getElementById('galleryGrid');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filter = btn.dataset.filter;
      const items = grid.querySelectorAll('.g-item');
      items.forEach(item => {
        const show = filter === 'all' || item.dataset.category === filter;
        item.style.display = show ? '' : 'none';
      });
    });
  });
</script>

</body>
</html>
